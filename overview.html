<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AI成长课 · 全页面原型总览</title><style>
*{box-sizing:border-box}body{margin:0;background:#edf0e8;color:#244331;font:14px/1.7 "Segoe UI","Microsoft YaHei",sans-serif}header{padding:35px 5vw 26px;max-width:1600px;margin:auto;display:flex;justify-content:space-between;gap:25px;align-items:center;border-bottom:1px solid #dce4d5}small{font-size:10px;color:#84977b;letter-spacing:2px}h1{font-size:27px;font-weight:550;letter-spacing:-.5px;margin:8px 0}header p{font-size:12px;color:#85977b;margin:0}a{background:#1e563c;color:white;border-radius:12px;padding:12px 19px;text-decoration:none;font-size:12px;white-space:nowrap}.legend{max-width:1600px;margin:0 auto;padding:23px 5vw 10px;font-size:11px;color:#879a7b}.grid{display:grid;grid-template-columns:repeat(auto-fit,270px);gap:38px 28px;max-width:1600px;margin:auto;padding:20px 5vw 55px;justify-content:center}.tile{width:270px}.tile-heading{display:flex;align-items:center;gap:10px;font-size:13px;margin-bottom:11px;font-weight:550}.tile-heading em{font-style:normal;font-size:10px;color:#a1b295}.phone{width:260px;height:560px;padding:6px;background:#29402e;border-radius:32px;box-shadow:0 10px 30px #2345290d;overflow:hidden}.viewport{width:248px;height:548px;border-radius:26px;overflow:hidden;background:#f7f8f4}iframe{width:393px;height:868px;transform:scale(.631);transform-origin:top left;border:0;display:block}.tile>p{font-size:10px;color:#8b9c81;margin:10px 0 0}footer{font-size:11px;color:#8b9a80;padding:0 5vw 40px;max-width:1600px;margin:auto}@media(max-width:650px){header{align-items:flex-start;flex-direction:column}.grid{grid-template-columns:270px}h1{font-size:23px}}
</style></head><body><header><div><small>BAINIANQIANCHENG / AI LEARNING</small><h1>从岗位到课程，完整学习路径。</h1><p>微信小程序 · iPhone 竖屏 · 15 个核心页面与状态</p></div><a href="prototype.html">进入可交互原型 →</a></header><div class="legend">两种起点：导入岗位 JD / 自主选择场景　→　任务选择　→　场景能力测验　→　分级课程　→　外部视频学习</div><main class="grid" id="grid"></main><footer>范围依据飞书《大学生AI学习小程序demo》。不包含内容创作工具、课程交易、学生入驻、支付和论坛。所有课程与测验均为演示数据。每块画布可单独点击体验。</footer><script>
const screens=[['home','学习首页','岗位导入与场景学习双入口'],['jd','岗位文字输入','目标岗位、JD 内容与示例体验'],['jdimage','岗位截图输入','图片选择、预览与格式提示'],['review','识别结果核对','编辑岗位文字后再分析'],['loading','能力匹配中','清晰说明当前处理步骤'],['analysis','岗位能力分析','原文依据与可调整的能力选择'],['catalog','17 类学习场景','分类、检索与具体任务'],['scene','选择目标任务','学习目标与交付成果'],['quiz','场景能力测验','四道题、单选及进度'],['result','测验结果与起点','推荐等级、回顾与重新测验'],['path','分级学习课程','三级知识点与视频时长筛选'],['course','课程详情','目标、目录与外部学习入口'],['plans','我的学习','已分级方向与待测验方向'],['empty','学习路径空态','从岗位或学习场景开始'],['noresults','搜索无结果','清除筛选后重新选择']];
document.getElementById('grid').innerHTML=screens.map(([key,name,desc],i)=>`<section class="tile"><div class="tile-heading"><em>${String(i+1).padStart(2,'0')}</em>${name}</div><div class="phone"><div class="viewport"><iframe title="${name}" src="prototype.html?screen=${key}" loading="lazy"></iframe></div></div><p>${desc}</p></section>`).join('');
</script></body></html>
