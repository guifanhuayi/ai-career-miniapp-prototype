<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>AI成长课 · 全页面平铺原型</title>
<style>
:root{--ink:#1f2937;--green:#1668dc;--muted:#667085;--line:#dbe4ef;--surface:#ffffff}*{box-sizing:border-box}html,body{height:100%;margin:0}body{background:#ffffff;color:var(--ink);font:13px/1.6 "Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;display:flex;flex-direction:column;overflow:hidden}button,input,a{font:inherit}button,a,input{touch-action:manipulation}button{border:0;cursor:pointer;color:inherit;background:none}a{text-decoration:none;color:inherit}button:focus-visible,a:focus-visible,input:focus-visible{outline:3px solid #1668dc;outline-offset:3px}.topbar{display:flex;justify-content:space-between;gap:24px;align-items:center;padding:20px 30px 17px;background:#ffffff;border-bottom:1px solid var(--line);flex-shrink:0}.brand{display:flex;align-items:center;gap:13px}.brand-mark{width:37px;height:37px;border-radius:11px;display:grid;place-items:center;background:#164782;color:#f2f6fc;font-size:19px;font-weight:600}.brand small{font-size:9px;color:#667085;letter-spacing:1.6px;display:block}h1{font-size:18px;font-weight:600;letter-spacing:-.3px;margin:2px 0 0}.actions{display:flex;gap:9px;align-items:center}.pill{font-size:11px;color:#667085;border:1px solid #dbe4ef;border-radius:7px;padding:5px 9px}.primary{background:var(--green);color:#fff;border-radius:10px;padding:10px 15px;font-size:12px;white-space:nowrap}.toolbar{padding:12px 30px;display:flex;align-items:center;justify-content:space-between;gap:20px;background:#ffffff;border-bottom:1px solid var(--line);flex-shrink:0}.flow{font-size:11px;color:#667085;display:flex;gap:12px;align-items:center;white-space:nowrap}.flow b{font-weight:500;color:#164782}.flow span{color:#667085}.controls{display:flex;align-items:center;gap:7px}.fit-button{font-size:11px;padding:6px 10px;border-radius:7px;white-space:nowrap;color:#667085}.fit-button.active{background:#dbe4ef;color:#164782}.control-divider{width:1px;height:19px;background:#dbe4ef;margin:0 6px}.zoom-step{width:26px;height:26px;border:1px solid #dbe4ef;border-radius:7px;background:white;font-size:17px;line-height:1}.zoom-readout{min-width:42px;font-size:11px;font-variant-numeric:tabular-nums;color:#1668dc;text-align:center}.zoom-slider{width:85px;height:4px;accent-color:#1668dc;cursor:pointer}.canvas{flex:1;min-height:0;overflow:auto;overscroll-behavior:contain;background-image:radial-gradient(#66708588 .7px,transparent .7px);background-size:15px 15px;position:relative;scrollbar-color:#667085 transparent;scrollbar-width:thin}.canvas-space{position:relative;margin:28px auto}.board{display:grid;grid-template-columns:repeat(var(--columns,5),405px);grid-auto-rows:936px;gap:44px;transform-origin:top left;position:absolute;left:0;top:0}.tile{width:405px;height:936px}.tile-heading{height:32px;display:flex;align-items:center;gap:12px;font-size:17px;font-weight:550;margin-bottom:10px}.tile-heading em{font-size:12px;font-weight:400;font-style:normal;letter-spacing:1px;color:#667085}.tile-heading a{margin-left:auto;font-size:11px;color:#667085;font-weight:400;display:flex;align-items:center;gap:5px}.tile-heading a:hover{color:#164782}.device{width:405px;height:864px;padding:6px;border-radius:35px;background:#263344;box-shadow:0 7px 24px #1647820d}.viewport{width:393px;height:852px;position:relative;border-radius:29px;overflow:hidden;background:#ffffff}.viewport iframe{width:393px;height:852px;border:0;display:block;pointer-events:none}.screen-link{position:absolute;inset:0;z-index:2;border-radius:29px;outline-offset:-3px!important}.screen-link:hover{box-shadow:inset 0 0 0 3px #667085}.screen-link:focus-visible{box-shadow:inset 0 0 0 4px #1668dc}.tile-description{height:20px;font-size:12px;color:#667085;margin:10px 0 0}.bottombar{display:flex;justify-content:space-between;align-items:center;gap:15px;padding:9px 30px;background:#ffffff;border-top:1px solid var(--line);font-size:10px;color:#667085;flex-shrink:0}.bottombar strong{font-weight:500;color:#1668dc}.legend-dot{display:inline-block;width:5px;height:5px;border-radius:50%;background:#667085;margin-right:6px}.icon{width:13px;height:13px;display:inline-block;vertical-align:middle;stroke:currentColor;stroke-width:1.7;fill:none;stroke-linecap:round;stroke-linejoin:round}@media(max-width:1100px){.flow{gap:8px;font-size:10px}.topbar,.toolbar{padding-left:22px;padding-right:22px}.pill{display:none}}@media(max-width:850px){.toolbar{flex-wrap:wrap;gap:10px}.controls{justify-content:flex-end;margin-left:auto}.flow{width:100%;justify-content:space-between}.topbar{padding-top:14px;padding-bottom:13px}h1{font-size:16px}.bottombar{padding:9px 20px}.bottombar .scope{display:none}}@media(max-width:480px){.topbar{padding:13px 14px;gap:10px}.brand{gap:9px}.brand-mark{width:30px;height:30px;font-size:16px}.brand small{font-size:7px;letter-spacing:.8px}h1{font-size:14px}.primary{font-size:10px;padding:9px 10px}.toolbar{padding:10px 14px}.flow{font-size:9px;gap:4px}.controls{width:100%;justify-content:space-between;gap:4px}.zoom-slider{width:65px}.control-divider{margin:0 2px}.fit-button{padding:5px 7px;font-size:10px}.bottombar{font-size:9px;padding:8px 14px}}
</style>
</head>
<body>
<header class="topbar"><div class="brand"><span class="brand-mark">前</span><div><small>BAINIANQIANCHENG / AI LEARNING</small><h1>AI成长课 · 全页面平铺原型</h1></div></div><div class="actions"><span class="pill">15 个页面与状态</span><a class="primary" href="prototype.html">进入交互原型 ↗</a></div></header>
<div class="toolbar"><div class="flow"><b>从岗位到学习</b><span>→</span>导入岗位<span>→</span>选择场景与任务<span>→</span>能力测验<span>→</span>分级课程</div><div class="controls" aria-label="画布缩放"><button class="fit-button active" id="fit-width" type="button" aria-pressed="true">适应宽度</button><button class="fit-button" id="fit-all" type="button" aria-pressed="false">全部适应</button><span class="control-divider"></span><button class="zoom-step" id="zoom-out" type="button" aria-label="缩小画布">−</button><input class="zoom-slider" id="zoom-slider" aria-label="画布缩放比例" type="range" min="5" max="120" step="1" value="50"><button class="zoom-readout" id="zoom-reset" type="button" title="恢复100%原始尺寸">50%</button><button class="zoom-step" id="zoom-in" type="button" aria-label="放大画布">+</button></div></div>
<main class="canvas" id="canvas" aria-label="15个原型页面平铺画布"><div class="canvas-space" id="canvas-space"><div class="board" id="board"></div></div></main>
<footer class="bottombar"><span><span class="legend-dot"></span><strong>15 个核心页面与状态</strong> · 点击页面进入对应交互原型</span><span class="scope">iPhone 393 × 852 · 本期功能 · 演示数据</span></footer>
<script>
// Review board for the complete prototype. Each preview keeps an independent demonstration state.
const screens=[['home','学习首页','岗位导入与场景学习双入口'],['jd','岗位文字输入','目标岗位、JD 内容与示例体验'],['jdimage','岗位截图输入','图片选择、预览与格式提示'],['review','识别结果核对','编辑岗位文字后再分析'],['loading','能力匹配中','清晰说明当前处理步骤'],['analysis','岗位能力分析','原文依据与可调整的能力选择'],['catalog','17 类学习场景','分类、检索与具体任务'],['scene','选择目标任务','学习目标与交付成果'],['quiz','场景能力测验','四道题、单选及进度'],['result','测验结果与起点','推荐等级、回顾与重新测验'],['path','分级学习课程','三级知识点与视频时长筛选'],['course','课程详情','目标、目录与外部学习入口'],['plans','我的学习','已分级方向与待测验方向'],['empty','学习路径空态','从岗位或学习场景开始'],['noresults','搜索无结果','清除筛选后重新选择']];
const board=document.getElementById('board'),canvas=document.getElementById('canvas'),space=document.getElementById('canvas-space');
board.innerHTML=screens.map(([key,name,desc],i)=>`<section class="tile"><div class="tile-heading"><em>${String(i+1).padStart(2,'0')}</em>${name}<a href="prototype.html?screen=${key}" aria-label="进入${name}交互原型">单页查看 <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M14 3h7v7 M21 3 10 14 M10 3H3v18h18v-7"/></svg></a></div><div class="device"><div class="viewport"><iframe title="${name}预览" src="prototype.html?screen=${key}" tabindex="-1" loading="eager"></iframe><a class="screen-link" href="prototype.html?screen=${key}" aria-label="打开${name}交互原型"></a></div></div><p class="tile-description">${desc}</p></section>`).join('');
let mode='width',scale=.5;
const params=new URLSearchParams(location.search);if(params.get('fit')==='all')mode='all';
function columns(){return window.innerWidth<600?2:window.innerWidth<1000?3:5}
function layout(){
 board.style.setProperty('--columns',columns());
 const width=board.offsetWidth,height=board.offsetHeight;
 if(mode==='width')scale=Math.min(1,(canvas.clientWidth-56)/width);
 if(mode==='all')scale=Math.min(1,(canvas.clientWidth-56)/width,(canvas.clientHeight-56)/height);
 scale=Math.max(.05,Math.min(1.2,scale));
 board.style.transform=`scale(${scale})`;space.style.width=`${width*scale}px`;space.style.height=`${height*scale}px`;
 document.getElementById('zoom-slider').value=Math.round(scale*100);document.getElementById('zoom-reset').textContent=Math.round(scale*100)+'%';
 for(const [id,m] of [['fit-width','width'],['fit-all','all']]){const b=document.getElementById(id);b.classList.toggle('active',mode===m);b.setAttribute('aria-pressed',String(mode===m))}
}
function fit(next){mode=next;layout();canvas.scrollTo(0,0)}
function zoom(next){mode='manual';scale=next;layout()}
document.getElementById('fit-width').addEventListener('click',()=>fit('width'));
document.getElementById('fit-all').addEventListener('click',()=>fit('all'));
document.getElementById('zoom-out').addEventListener('click',()=>zoom(scale-.1));
document.getElementById('zoom-in').addEventListener('click',()=>zoom(scale+.1));
document.getElementById('zoom-reset').addEventListener('click',()=>zoom(1));
document.getElementById('zoom-slider').addEventListener('input',e=>zoom(Number(e.target.value)/100));
window.addEventListener('resize',layout);layout();
</script>
</body>
</html>
